<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="logo.png?v=2">
  <link rel="shortcut icon" href="logo.png?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codrxs Academy | Staff & Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: radial-gradient(circle at top right, #0f172a 0%, #072e44 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 0.88rem;
      color: var(--gray);
      margin-bottom: 24px;
    }
    .security-notice {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      margin-top: 10px;
    }
    .alert-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      margin-bottom: 18px;
      display: none;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--gray);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="logo.png" alt="Codrxs Logo" style="height: 48px; max-width: 100%; object-fit: contain;">
    </div>

    <div class="login-header">
      <h2>Restricted Admin Portal</h2>
      <p>Please enter authorized credentials to access candidate interest records and analytics.</p>
    </div>

    <div class="security-notice">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Protected session with encrypted token verification.</span>
    </div>

    <div id="loginError" class="alert-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="loginErrorText">Invalid username or password.</span>
    </div>

    <form id="adminLoginForm">
      <div class="form-field">
        <label for="username">Staff Username</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="username" placeholder="admin" required autocomplete="username">
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-btn" id="loginSubmitBtn">
        <span>Verify & Enter Dashboard</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Return to Main Website</a>
  </div>

  <script>
    // If already logged in, redirect straight to admin
    if (localStorage.getItem('codrxs_admin_token')) {
      window.location.replace('/admin.html');
    }

    const form = document.getElementById('adminLoginForm');
    const errBox = document.getElementById('loginError');
    const errText = document.getElementById('loginErrorText');
    const submitBtn = document.getElementById('loginSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success && data.token) {
          localStorage.setItem('codrxs_admin_token', data.token);
          localStorage.setItem('codrxs_admin_user', data.user || 'Admin');
          window.location.replace('/admin.html');
        } else {
          errText.textContent = data.message || 'Access denied. Incorrect username or password.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Verify & Enter Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        errText.textContent = 'Server connection failed. Ensure backend service is running.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Verify & Enter Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
